<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Beer Predictor{% endblock %} — The Beer Predictor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,800;0,9..144,900;1,9..144,400;1,9..144,600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper:        #F1E8D3;
      --paper-deep:   #E6DABB;
      --paper-soft:   #F8F1DE;
      --ink:          #1A1410;
      --ink-soft:     #4A382A;
      --ink-light:    #6B5848;
      --copper:       #B0651E;
      --copper-dim:   #8A4E16;
      --oxblood:      #6B1F1F;
      --hairline:     rgba(26, 20, 16, 0.20);
      --hairline-soft:rgba(26, 20, 16, 0.10);

      --serif:   "Newsreader", Georgia, "Times New Roman", serif;
      --display: "Fraunces", Georgia, serif;
      --mono:    "IBM Plex Mono", "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
    }

    *, *::before, *::after { box-sizing: border-box; }

    /* Page-wide cream paper with a faint copper/oxblood wash and a barely-there
       grain texture (inline SVG turbulence — no network requests). */
    html, body { margin: 0; padding: 0; }
    body {
      background-color: var(--paper);
      background-image:
        radial-gradient(at 18% 12%, rgba(176,101,30,0.06), transparent 50%),
        radial-gradient(at 84% 78%, rgba(107,31,31,0.05), transparent 55%),
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 240 240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.55  0 0 0 0 0.40  0 0 0 0 0.20  0 0 0 0.07 0'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>");
      background-attachment: fixed;
      color: var(--ink);
      font-family: var(--serif);
      font-size: 17px;
      line-height: 1.5;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .sheet {
      max-width: 44rem;
      margin: 0 auto;
      padding: 4.5rem 2rem 3rem;
      position: relative;
    }

    /* Top-left "return to publication" ribbon, like a return-address slip. */
    .return-ribbon {
      position: absolute;
      top: 1.7rem; left: 2rem;
      display: inline-flex; align-items: center; gap: 0.5rem;
      font-family: var(--mono);
      font-size: 0.66rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--ink-soft);
      text-decoration: none;
      padding-bottom: 2px;
      border-bottom: 1px solid transparent;
      transition: color 0.18s ease, border-color 0.18s ease;
    }
    .return-ribbon::before {
      content: "←";
      font-family: var(--display);
      font-style: italic;
      font-size: 0.95rem;
      letter-spacing: 0;
      transform: translateY(-1px);
    }
    .return-ribbon:hover {
      color: var(--copper-dim);
      border-bottom-color: var(--copper-dim);
    }

    /* Dept. masthead bar */
    .dept-bar {
      display: flex; align-items: baseline; justify-content: space-between;
      font-family: var(--mono);
      font-size: 0.7rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--ink-soft);
      padding-bottom: 0.55rem;
    }
    .dept-bar .right { color: var(--ink-light); }

    /* Broadsheet double-rule — exactly the same recipe as the main app. */
    .rule-double {
      border: 0;
      height: 5px;
      background:
        linear-gradient(to bottom,
          var(--ink) 0, var(--ink) 1px,
          transparent 1px, transparent 3px,
          var(--ink) 3px, var(--ink) 4px,
          transparent 4px);
      margin: 0 0 1.8rem 0;
    }

    /* Folio numeral — small italic copper roman, hanging above the title. */
    .folio {
      font-family: var(--display);
      font-style: italic;
      font-weight: 400;
      font-variation-settings: "opsz" 60;
      font-size: 2rem;
      line-height: 1;
      color: var(--copper);
      margin: 1.8rem 0 0.2rem 0;
      letter-spacing: 0.01em;
    }

    /* Display heading — Fraunces 900 at large optical size. */
    h1.broadsheet-title {
      font-family: var(--display);
      font-weight: 900;
      font-variation-settings: "opsz" 144;
      font-size: clamp(3rem, 8vw, 5.6rem);
      line-height: 0.88;
      letter-spacing: -0.025em;
      margin: 0.4rem 0 1.1rem 0;
      color: var(--ink);
    }
    h1.broadsheet-title .stop {
      color: var(--copper);
      font-style: italic;
      font-weight: 400;
    }

    .dek {
      font-family: var(--serif);
      font-style: italic;
      font-size: 1.1rem;
      color: var(--ink-soft);
      max-width: 38ch;
      margin: 0 0 2.4rem 0;
      line-height: 1.5;
    }

    /* Notices (flashed messages) — left-rule slip. */
    .notice {
      margin: 0 0 1.6rem 0;
      padding: 0.85rem 1rem 0.85rem 1.2rem;
      background: var(--paper-deep);
      border-left: 3px solid var(--oxblood);
      font-family: var(--serif);
      font-style: italic;
      color: var(--ink-soft);
      font-size: 0.97rem;
    }
    .notice.info  { border-left-color: var(--copper); }
    .notice.error { border-left-color: var(--oxblood); }

    /* Form — pen-ruled fields, no boxes. Label and hint share a baseline. */
    .fields { display: flex; flex-direction: column; gap: 1.7rem; margin: 0; }

    .field { position: relative; }
    .field-meta {
      display: flex; justify-content: space-between; align-items: baseline;
      margin-bottom: 0.35rem;
    }
    .field-meta label {
      font-family: var(--mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }
    .field-hint {
      font-family: var(--serif);
      font-style: italic;
      font-size: 0.78rem;
      color: var(--ink-light);
      letter-spacing: 0;
    }

    .field input {
      width: 100%;
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--ink);
      padding: 0.55rem 0 0.5rem 0;
      font-family: var(--serif);
      font-size: 1.18rem;
      color: var(--ink);
      outline: none;
      transition: border-color 0.2s ease, padding-bottom 0.2s ease;
      caret-color: var(--copper);
    }
    .field input::placeholder {
      color: var(--ink-light);
      font-style: italic;
      opacity: 0.7;
    }
    .field input:focus {
      border-bottom-color: var(--copper);
      border-bottom-width: 2px;
      padding-bottom: calc(0.5rem - 1px);
    }
    .field input:-webkit-autofill {
      -webkit-box-shadow: 0 0 0 1000px var(--paper) inset;
      -webkit-text-fill-color: var(--ink);
    }

    /* Ornamental separator between form and submit slug. */
    .ornament {
      text-align: center;
      font-family: var(--display);
      font-style: italic;
      font-weight: 400;
      font-size: 1.5rem;
      color: var(--copper);
      letter-spacing: 1.2rem;
      margin: 1.4rem 0 1rem 0;
      user-select: none;
    }
    .ornament.solo {
      letter-spacing: 0;
      font-size: 2rem;
      margin: 2.2rem 0 1.2rem 0;
      color: var(--copper-dim);
    }

    /* Primary action — letterpress slug with a copper drop-shadow stamp. */
    .primary-action {
      display: inline-flex; align-items: baseline; gap: 0.85rem;
      font-family: var(--mono);
      font-weight: 600;
      font-size: 0.78rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--paper);
      background: var(--ink);
      padding: 1.05rem 2rem;
      border: 0;
      cursor: pointer;
      position: relative;
      box-shadow:
        0  1px 0  var(--ink),
        0  3px 0  var(--copper-dim),
        5px 7px 0 rgba(26, 20, 16, 0.18);
      transition: transform 0.16s ease, box-shadow 0.16s ease;
      text-decoration: none;
    }
    .primary-action .arrow {
      font-family: var(--display);
      font-style: italic;
      font-weight: 400;
      font-size: 1.15rem;
      letter-spacing: 0;
      color: var(--paper);
      transform: translateY(1px);
    }
    .primary-action:hover {
      transform: translate(-2px, -2px);
      box-shadow:
        0  1px 0  var(--ink),
        0  3px 0  var(--copper-dim),
        7px 9px 0 rgba(26, 20, 16, 0.22);
    }
    .primary-action:active {
      transform: translate(1px, 1px);
      box-shadow:
        0  1px 0  var(--ink),
        0  3px 0  var(--copper-dim),
        2px 3px 0 rgba(26, 20, 16, 0.16);
    }
    .primary-action:focus-visible {
      outline: 2px solid var(--copper);
      outline-offset: 4px;
    }

    /* Tertiary links — small caps with copper-dim underlines for contrast. */
    .tertiary {
      margin-top: 2.4rem;
      display: flex; flex-wrap: wrap; gap: 1.6rem 1.8rem;
      font-family: var(--mono);
      font-size: 0.7rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }
    .tertiary a {
      color: var(--copper-dim);
      text-decoration: none;
      border-bottom: 1px solid var(--copper-dim);
      padding-bottom: 1px;
      transition: color 0.18s ease, border-color 0.18s ease;
    }
    .tertiary a:hover { color: var(--ink); border-bottom-color: var(--ink); }

    /* Imprint at the very bottom of the sheet. */
    .imprint {
      margin: 3.2rem 0 0 0;
      padding-top: 1.4rem;
      border-top: 1px solid var(--hairline);
      font-family: var(--mono);
      font-size: 0.62rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--ink-light);
      text-align: center;
    }

    /* Ink-bleed reveal — staggered. */
    .dept-bar, .rule-double, .folio,
    h1.broadsheet-title, .dek, .fields, .ornament, .tertiary {
      opacity: 0;
      animation: ink 0.7s ease-out forwards;
    }
    .dept-bar           { animation-delay: 0.00s; }
    .rule-double        { animation-delay: 0.05s; }
    .folio              { animation-delay: 0.14s; }
    h1.broadsheet-title { animation-delay: 0.20s; }
    .dek                { animation-delay: 0.30s; }
    .fields             { animation-delay: 0.40s; }
    .ornament           { animation-delay: 0.50s; }
    .tertiary           { animation-delay: 0.58s; }

    @keyframes ink {
      from { opacity: 0; transform: translateY(6px); filter: blur(1px); }
      to   { opacity: 1; transform: translateY(0); filter: blur(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .dept-bar, .rule-double, .folio,
      h1.broadsheet-title, .dek, .fields, .ornament, .tertiary {
        animation: none;
        opacity: 1;
      }
    }

    /* Mobile */
    @media (max-width: 620px) {
      .sheet { padding: 4rem 1.25rem 2.5rem; }
      .dept-bar { font-size: 0.6rem; letter-spacing: 0.2em; }
      .dept-bar .right { display: none; }
      .return-ribbon { top: 1.1rem; left: 1.25rem; font-size: 0.6rem; }
      .folio { font-size: 1.6rem; }
      h1.broadsheet-title { font-size: clamp(2.4rem, 12vw, 3.6rem); }
      .ornament { letter-spacing: 0.8rem; font-size: 1.3rem; }
      .primary-action { padding: 0.95rem 1.6rem; font-size: 0.72rem; }
    }
  </style>
</head>
<body>
  <main class="sheet">
    <a class="return-ribbon" href="/">The Beer Predictor</a>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, msg in messages %}
        <div class="notice {{ category }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}

    <p class="imprint">Set in Fraunces, Newsreader &amp; IBM Plex Mono · Printed on cream, in copper ink</p>
  </main>
</body>
</html>

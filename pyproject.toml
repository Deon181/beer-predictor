[project]
name = "beer-predictor"
version = "0.1.0"
description = "Beer recommender — taste-profile sliders match beers from a public catalog."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "pyarrow>=15.0",
    "plotly>=5.20",
    "dash>=2.17",
    "dash-bootstrap-components>=1.6",
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
    "datasets>=2.18",
    "requests>=2.31",
    "supabase>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "gunicorn>=22.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

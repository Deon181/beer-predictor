[project]
name = "beer-predictor-pipeline"
version = "0.1.0"
description = "Data pipeline for the Beer Predictor — fetches, samples, and engineers the taste-vector catalog."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
    "datasets>=2.18",
    "requests>=2.31",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
